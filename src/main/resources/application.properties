spring.application.name=feedback-management

server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/feedbackdb}
spring.datasource.username=${DB_USERNAME:feedback}
spring.datasource.password=${DB_PASSWORD:feedback123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-message=never