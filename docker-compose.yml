
services:

  feedback-app:
    build: .
    container_name: feedback-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/feedbackdb
      DB_USERNAME: feedback
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: feedback-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: feedbackdb
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedbackdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
